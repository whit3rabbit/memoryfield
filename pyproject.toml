[project]
name = "memoryfield"
dynamic = ["version"]
description = "Memoryfield: a search-first, tiered-read memory tool for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "whit3rabbit" },
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastembed>=0.8",
    "sqlite-vec>=0.1",
    "pyyaml>=6",
    # The `mf init` / `mf setup` wizard. Pure Python, three packages
    # (questionary, prompt_toolkit, wcwidth); imported lazily so the
    # non-interactive paths never load it.
    "questionary>=2.1",
    # The MCP server (`mf mcp`). Core since 5.4 so the entry `mf setup`
    # writes works on a plain install; the footprint is in ROADMAP.md 5.4.
    "mcp>=2.1,<3",
]

[project.urls]
Homepage = "https://github.com/whit3rabbit/memoryfield"
Repository = "https://github.com/whit3rabbit/memoryfield"

[project.optional-dependencies]
mlx = ["mlx-embedding-models>=0.0.11; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
mf = "mf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mf"]

[tool.hatch.build.targets.sdist]
only-include = ["mf"]

# The one place the version lives; `mf --version` reads the same string.
[tool.hatch.version]
path = "mf/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors, except the ResourceWarning an older test's unclosed
# sqlite handle raises at garbage-collection time inside some later test.
filterwarnings = ["error", "ignore::ResourceWarning"]
markers = ["anyio: async test run by the anyio plugin"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ARG", "RUF"]
# E501: the codebase wraps prose comments at 72 and code at 120 by hand.
# RUF001-003: em dashes and other typographic characters in docstrings
# and user-facing strings are content, not confusables.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test stand-ins take the real signature and ignore most of it.
"tests/*" = ["ARG001", "ARG005"]
