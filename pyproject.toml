[project]
name = "mf"
version = "0.1.0"
description = "Memoryfield: a search-first, tiered-read memory tool for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "whit3rabbit" },
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastembed>=0.8",
    "sqlite-vec>=0.1",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/whit3rabbit/memoryfields"
Repository = "https://github.com/whit3rabbit/memoryfields"

[project.optional-dependencies]
eval = ["fastembed>=0.8"]
mlx = ["mlx-embedding-models>=0.0.11; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mcp = ["mcp>=2.1,<3"]

[project.scripts]
mf = "mf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mcp>=2.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mf"]

[tool.hatch.build.targets.sdist]
only-include = ["mf"]
