[project]
name = "mf"
version = "0.1.0"
description = "Memoryfield: a search-first, tiered-read memory tool for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8",
    "sqlite-vec>=0.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
eval = ["fastembed>=0.8"]
mlx = ["mlx-embedding-models>=0.0.11; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
mf = "mf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mf"]
