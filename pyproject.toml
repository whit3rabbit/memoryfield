[project]
name = "mf"
version = "0.1.0"
description = "Memoryfield: a search-first, tiered-read memory tool for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eval = ["fastembed>=0.8"]

[project.scripts]
mf = "mf.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mf"]
