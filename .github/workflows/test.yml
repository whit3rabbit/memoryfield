name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # uv's own managed CPython builds for macOS runners lack
      # --enable-loadable-sqlite-extensions (AttributeError:
      # 'sqlite3.Connection' object has no attribute
      # 'enable_load_extension', needed by sqlite-vec). actions/setup-python's
      # macOS builds do have it, so provision the interpreter that way on
      # macOS and tell uv to use it instead of downloading its own.
      - uses: actions/setup-python@v7
        if: runner.os == 'macOS'
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # gotcha 21 (CLAUDE.md): --extra and --group don't compose across
      # separate `uv sync` calls, so both go in one.
      - run: uv sync --extra eval --group dev
        env:
          UV_PYTHON_PREFERENCE: ${{ runner.os == 'macOS' && 'only-system' || '' }}

      - run: uv run pytest tests/ -q
        env:
          UV_PYTHON_PREFERENCE: ${{ runner.os == 'macOS' && 'only-system' || '' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - run: uv sync --extra eval --group dev

      # Pinned to the repo's local ruff version. Bump deliberately, not as
      # a side effect of an unrelated change.
      - run: uvx ruff@0.16.5 check mf/ eval/ tests/

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Bare `pyright` isn't on PATH (CLAUDE.md gotcha). Scoped to mf/tests,
      # not pyrightconfig.json's full include (which also has eval/, and
      # eval/calibrate_dedup.py has 2 pre-existing errors outside this
      # command's verified-clean baseline -- confirmed 2026-09-02).
      - run: npx --yes pyright mf/ tests/
